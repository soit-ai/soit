version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      backend-runtime:
        dependency-type: production
      backend-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    ignore:
      # Base-image majors track the LTS cadence manually.
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Node majors are adopted manually on LTS lines only.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
