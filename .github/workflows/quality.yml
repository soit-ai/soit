name: quality

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-p0:
    name: backend-p0
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SOIT_TESTING: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soit_test
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Validate fresh-install and N-1 migration paths
        run: |
          test "$(find alembic/versions -maxdepth 1 -name '*.py' | wc -l)" -eq 2
          test "$(uv run alembic heads)" = "20260723160000 (head)"
          uv run pytest tests/unit/test_fresh_install_migration.py tests/unit/test_n1_migration_fixture.py tests/unit/test_scoped_secret_migration.py -q

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Agent contract lint
        run: >
          uv run ruff check
          app/modules/agent/application/schemas.py
          app/modules/agent/application/service.py
          app/modules/agent/application/application_service.py
          app/api/v1/agent/handlers.py
          tests/unit/test_agent_service.py
          tests/unit/test_agent_rag.py
          tests/integration/test_agent_publish_and_execute.py
          tests/entrypoints/test_agent_api.py
          tests/entrypoints/test_agent_stream_api.py
          --select F,E402,I

      - name: Import boundaries
        run: uv run lint-imports --config importlinter.ini

      - name: Agent contract tests
        run: >
          uv run pytest
          tests/unit/test_agent_service.py
          tests/unit/test_agent_rag.py
          tests/integration/test_agent_publish_and_execute.py
          tests/entrypoints/test_agent_api.py
          tests/entrypoints/test_agent_stream_api.py
          -q

      - name: Enterprise MVP demo contracts
        run: >
          uv run pytest
          tests/entrypoints/test_api_route_convergence.py
          tests/integration/test_enterprise_agent_mvp.py
          -q

      - name: Support ticket regression evaluator
        env:
          SOIT_TESTING: "1"
        run: >
          uv run python
          scripts/evaluate_support_ticket_regression.py
          --json-output ../artifacts/support-ticket-regression/report-current.json

      - name: Support ticket regression contract
        run: uv run pytest tests/integration/test_support_ticket_regression_evaluator.py -q

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Entrypoint tests
        run: uv run pytest tests/entrypoints -q

      - name: Integration tests
        run: uv run pytest tests/integration -q

      - name: Top-level backend tests
        run: >
          uv run pytest
          tests/test_spec_validation.py
          tests/test_model_scope_audit.py
          tests/test_trace_emission.py
          -q

  backend-strict:
    name: backend-strict
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check app tests

      - name: Pyright
        run: uv run pyright

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soit_container
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soit_container"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build backend image
        run: docker build --tag soit-api:ci ./server

      - name: Apply migrations from image
        run: >-
          docker run --rm --network host
          -e ENVIRONMENT=development
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/soit_container
          -e REDIS_URL=redis://127.0.0.1:6379/0
          -e EVENT_BUS_BACKEND=redis
          -e EVENT_BUS_REDIS_URL=redis://127.0.0.1:6379/0
          soit-api:ci alembic upgrade head

      - name: Start backend image
        run: >-
          docker run --detach --name soit-api-ci --network host
          -e ENVIRONMENT=development
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/soit_container
          -e REDIS_URL=redis://127.0.0.1:6379/0
          -e EVENT_BUS_BACKEND=redis
          -e EVENT_BUS_REDIS_URL=redis://127.0.0.1:6379/0
          soit-api:ci

      - name: Verify backend readiness
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9200/health/ready | grep --quiet '"status":"ready"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs soit-api-ci
          exit 1

      - name: Start outbox dispatcher image
        run: >-
          docker run --detach --name soit-outbox-ci --network host
          -e ENVIRONMENT=development
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/soit_container
          -e REDIS_URL=redis://127.0.0.1:6379/0
          -e EVENT_BUS_BACKEND=redis
          -e EVENT_BUS_REDIS_URL=redis://127.0.0.1:6379/0
          soit-api:ci python scripts/outbox_dispatcher.py

      - name: Verify outbox dispatcher readiness
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9201/metrics | grep --quiet 'soit_outbox_pending'; then
              exit 0
            fi
            sleep 2
          done
          docker logs soit-outbox-ci
          exit 1

      - name: Stop backend image
        if: always()
        run: |
          docker rm --force soit-outbox-ci || true
          docker rm --force soit-api-ci || true

  frontend-p0:
    name: frontend-p0
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
