# Overlay that runs the quickstart topology from released images instead of
# building locally. Usage from the repository root:
#
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml -f docker/docker-compose.images.yml pull
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml -f docker/docker-compose.images.yml \
#     up -d --no-build postgres redis minio etcd milvus vault migrate bootstrap api web knowledge-ingest-worker outbox-dispatcher scheduler
#
# The overlay names application services only, so it also layers over
# docker/docker-compose.app.yml when the infrastructure is your own.
#
# Pin a release with SOIT_IMAGE_TAG (defaults to v1.8.0). The released web
# image calls the API on its own origin and proxies it to the api service, so
# it works whatever host ports are published.

services:
  migrate:
    image: ghcr.io/soit-ai/soit/server:${SOIT_IMAGE_TAG:-v1.8.0}

  bootstrap:
    image: ghcr.io/soit-ai/soit/server:${SOIT_IMAGE_TAG:-v1.8.0}

  api:
    image: ghcr.io/soit-ai/soit/server:${SOIT_IMAGE_TAG:-v1.8.0}

  outbox-dispatcher:
    image: ghcr.io/soit-ai/soit/server:${SOIT_IMAGE_TAG:-v1.8.0}

  # Fires due schedules. Without an image here, `up --no-build` had nothing to
  # run it from and schedules silently never fired.
  scheduler:
    image: ghcr.io/soit-ai/soit/server:${SOIT_IMAGE_TAG:-v1.8.0}

  knowledge-ingest-worker:
    image: ghcr.io/soit-ai/soit/knowledge-worker:${SOIT_IMAGE_TAG:-v1.8.0}

  web:
    image: ghcr.io/soit-ai/soit/web:${SOIT_IMAGE_TAG:-v1.8.0}
