# SOIT application processes: migrations, admin bootstrap, the API, the web UI
# and the background workers. No infrastructure is defined here.
#
# docker-compose.yml includes this file with docker-compose.infra.yml and
# docker-compose.deps.yml, which is the default quickstart. Run this file on
# its own when PostgreSQL, Redis, object storage, the vector store and Vault
# are already running elsewhere, and point it at them from .env:
#
#   docker compose --env-file .env -f docker/docker-compose.app.yml up -d
#
# Standalone, nothing here waits for infrastructure health, so start it only
# once your services accept connections. Inside a container `localhost` is the
# container itself: reach a service on the Docker host through
# host.docker.internal, which every backend service below maps to the host
# gateway. docker/README.md lists the variables to override.
name: soit

# Container stdout rotation. The json-file driver has no size cap unless one
# is given: on 2026-09-01 a single stopped milvus container's log reached
# 90.8 GB, filled the host disk, and took MinIO down with XMinioStorageFull.
# Anchored once here so no service can quietly miss it.
x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '100m'
    max-file: '3'

# Docker Desktop resolves host.docker.internal on its own; Linux engines need
# the mapping spelled out.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  migrate:
    build:
      context: ../server
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment: &server_environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-soit}
      DATABASE_PASS: ${DATABASE_PASS:-soit}
      DATABASE_NAME: ${DATABASE_NAME:-soit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      STORAGE_URL: ${STORAGE_URL:-s3://soit-artifacts}
      STORAGE_OPTIONS_JSON: ${STORAGE_OPTIONS_JSON:-{"endpoint_url":"http://minio:9000","key":"soitminio","secret":"soitminio"}}
      STORAGE_AUTO_MKDIR: ${STORAGE_AUTO_MKDIR:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-soitminio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-soitminio}
      MINIO_BUCKET: ${MINIO_BUCKET:-soit-artifacts}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      VAULT_URL: ${VAULT_URL:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-soit-vault-root}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      # Self-hosted default: one workday. There is no token refresh flow yet,
      # so a short lifetime silently logs users out mid-session.
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      SYSTEM_MAIL_ENABLED: ${SYSTEM_MAIL_ENABLED:-false}
      SYSTEM_MAIL_URL: ${SYSTEM_MAIL_URL:-}
      SYSTEM_MAIL_LINK_BASE_URL: ${SYSTEM_MAIL_LINK_BASE_URL:-}
      SCHEDULE_WORKER_POLL_INTERVAL: ${SCHEDULE_WORKER_POLL_INTERVAL:-15}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-1.2.0}
      PLATFORM_EDITION: ${PLATFORM_EDITION:-community}
      PLATFORM_ENTITLEMENTS: ${PLATFORM_ENTITLEMENTS:-[]}
      ENABLE_EGRESS_POLICY: ${ENABLE_EGRESS_POLICY:-true}
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-[]}
      EGRESS_BLOCKLIST: ${EGRESS_BLOCKLIST:-[]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-redis}
      EVENT_BUS_REDIS_URL: ${EVENT_BUS_REDIS_URL:-redis://redis:6379/0}
      KNOWLEDGE_INGEST_WORKER_POLL_INTERVAL: ${KNOWLEDGE_INGEST_WORKER_POLL_INTERVAL:-1.0}
      KNOWLEDGE_INGEST_WORKER_MAX_TASKS: ${KNOWLEDGE_INGEST_WORKER_MAX_TASKS:-0}
      KNOWLEDGE_INGEST_WORKER_CONCURRENCY: ${KNOWLEDGE_INGEST_WORKER_CONCURRENCY:-1}
      OUTBOX_DISPATCHER_ENABLED: "false"
      OUTBOX_DISPATCHER_POLL_INTERVAL: ${OUTBOX_DISPATCHER_POLL_INTERVAL:-1.0}
      OUTBOX_DISPATCHER_BATCH_LIMIT: ${OUTBOX_DISPATCHER_BATCH_LIMIT:-50}
      OUTBOX_DISPATCHER_MAX_ATTEMPTS: ${OUTBOX_DISPATCHER_MAX_ATTEMPTS:-64}
      OUTBOX_DISPATCHER_LEASE_SECONDS: ${OUTBOX_DISPATCHER_LEASE_SECONDS:-60}
      OUTBOX_DISPATCHER_METRICS_PORT: ${OUTBOX_DISPATCHER_METRICS_PORT:-9201}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-soit-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_TRACES_SAMPLE_RATIO: ${OTEL_TRACES_SAMPLE_RATIO:-1.0}
    command: ["sh", "scripts/migrate.sh"]
    restart: "no"
    logging: *default-logging

  bootstrap:
    build:
      context: ../server
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment:
      <<: *server_environment
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-changeme123}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-default}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - scripts/bootstrap_admin.py
      - --email
      - ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      - --password
      - ${BOOTSTRAP_ADMIN_PASSWORD:-changeme123}
      - --name
      - ${BOOTSTRAP_ADMIN_NAME:-Admin}
      - --tenant-name
      - ${BOOTSTRAP_TENANT_NAME:-default}
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ../server
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment:
      <<: *server_environment
      WORKFLOW_ORPHAN_REAPER_ENABLED: ${WORKFLOW_ORPHAN_REAPER_ENABLED:-true}
      # Queued interactions (approval resumes, task retries) run in the API's
      # durable worker; without it they wait forever.
      RESPONSE_INTERACTION_WORKER_ENABLED: ${RESPONSE_INTERACTION_WORKER_ENABLED:-true}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9200"]
    ports:
      - "${API_PUBLISHED_PORT:-9200}:9200"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9200/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ../web
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:9200/api/v1}
    environment:
      PORT: 5000
    ports:
      - "${WEB_PUBLISHED_PORT:-5000}:5000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  knowledge-ingest-worker:
    build:
      context: ../server
      target: knowledge-worker
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment:
      <<: *server_environment
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "scripts/ingest_worker.py"]
    restart: unless-stopped
    logging: *default-logging

  outbox-dispatcher:
    build:
      context: ../server
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment:
      <<: *server_environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "scripts/outbox_dispatcher.py"]
    expose:
      - "9201"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9201/metrics', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # Fires due schedules. Its own process for the same reason the dispatcher is:
  # a scheduler that shares a process with request handling competes with it,
  # and an API restart should not be a gap in when jobs fire.
  scheduler:
    build:
      context: ../server
    env_file:
      - path: ../.env
        required: false
    extra_hosts: *host-gateway
    environment:
      <<: *server_environment
      SCHEDULE_WORKER_ENABLED: "true"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "scripts/schedule_worker.py"]
    restart: unless-stopped
    logging: *default-logging
