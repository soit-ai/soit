# Quickstart: the whole stack, application and bundled infrastructure.
#
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#
# This file only assembles three others, so the stack can also be started in
# parts when some infrastructure already exists (see docker/README.md):
#
#   docker-compose.infra.yml  PostgreSQL, Redis, MinIO, Milvus + etcd, Vault
#   docker-compose.app.yml    migrations, bootstrap, API, web and workers
#   docker-compose.deps.yml   makes the application wait for that infrastructure
#
# Requires Docker Compose v2.24 or later for `include` with override files.
name: soit

include:
  - docker-compose.infra.yml
  - path:
      - docker-compose.app.yml
      - docker-compose.deps.yml
