[project]
name = "soit"
version = "0.1.0"
description = "A LLM platform with a built-in web application"
readme = "README.md"
authors = [
    { name = "Jude", email = "admin@example.com" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>1.10.13,<3.0.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx>=0.25.1,<1.0.0",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "bcrypt==4.0.1",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]<2.0.0,>=1.40.6",
    "pyjwt<3.0.0,>=2.8.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.2.1,<6.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pluggy>=1.5.0,<2.0.0",
    "psutil>=7.0.0,<8.0.0",
    "restrictedpython>=8.0,<9.0.0",
    "pip-audit>=2.8.0,<3.0.0",
    "mypy>=1.15.0,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "aiohttp>=3.11.14,<4.0.0",
    "sse-starlette>=2.2.1,<3.0.0",
    "pymilvus==2.5.11",
    "langchain==0.3.25",
    "openai==1.6.1",
    "aiofiles>=23.2.1,<24.0.0",
    "python-magic==0.4.27",
    "python-docx==1.0.1",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "beautifulsoup4==4.12.2",
    "markdown==3.5.1",
    "PyYAML==6.0.1",
    "boto3>=1.34.11,<2.0.0",
    "google-cloud-storage>=2.14.0,<3.0.0",
    "oss2>=2.18.3,<3.0.0",
    "cos-python-sdk-v5>=1.9.25,<2.0.0",
    "aioredis>=2.0.1,<3.0.0",
    "prometheus-client>=0.21.1,<1.0.0",
    "setuptools>=80.4.0,<81.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "langchain-community==0.3.20",
    "sqlmodel==0.0.24",
    "sqlalchemy==2.0.31",
    "pytest>=7.4.4,<8.0.0",
    "pytest-asyncio>=0.23.8,<0.24.0",
    "tiktoken>=0.9.0",
    "flower>=2.0.1",
    "sentence-transformers>=4.1.0",
    "langchain-huggingface>=0.0.6",
    "transformers>=4.52.3",
    "huggingface-hub>=0.32.2",
    "pytz>=2025.2",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch==2.6.0",
    "pypdf==5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
disallow_untyped_defs = false
ignore_missing_imports = true
ignore_attr_defined = true

[tool.ruff]
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
