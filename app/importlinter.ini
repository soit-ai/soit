[importlinter]
root_package = app

[importlinter:contract:kernel_isolation]
name = Kernel is isolated
type = forbidden
source_modules =
    app.kernel
forbidden_modules =
    app.api
    app.modules
    app.adapters
    app.infra
    app.wiring

[importlinter:contract:api_does_not_import_domain]
name = API does not import domain directly
type = forbidden
source_modules =
    app.api
forbidden_modules =
    app.modules.appcenter.domain
    app.modules.chat.domain
    app.modules.dataset.domain
    app.modules.identity.domain
    app.modules.modelhub.domain
    app.modules.pluginmarket.domain
    app.modules.workflow.domain

[importlinter:contract:appcenter_application_does_not_import_infrastructure]
name = appcenter application does not import infrastructure
type = forbidden
source_modules =
    app.modules.appcenter.application
forbidden_modules =
    app.modules.appcenter.infrastructure

