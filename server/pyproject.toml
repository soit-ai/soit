[project]
name = "soit"
version = "1.0.0"
description = "A LLM platform with a built-in web application"
readme = "README.md"
authors = [
    { name = "Jude", email = "jude@soit.ai" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "email-validator>=2.3.0,<3.0.0.0",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "emails>=1.1.2,<2.0",
    "jinja2>=3.1.6,<4.0.0",
    "alembic>=1.18.5,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "bcrypt==5.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "sentry-sdk[fastapi]>=2.66.1,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "celery>=5.6.3,<6.0.0",
    "redis>=8.1.0,<9.0.0",
    "uvicorn[standard]>=0.52.1,<1.0.0",
    "pluggy>=1.6.0,<2.0.0",
    "psutil>=7.2.2,<8.0.0",
    "restrictedpython>=8.4,<9.0.0",
    "requests>=2.34.2,<3.0.0",
    "sse-starlette>=3.4.6,<4.0.0",
    "pymilvus==3.0.1",
    "openai==2.52.0",
    "aiofiles>=25.1.0,<26.0.0",
    "python-magic==0.4.27",
    "pandas==3.0.5",
    "openpyxl>=3.1.5,<4.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "PyYAML==6.0.3",
    "google-cloud-storage>=3.13.0,<4.0.0",
    "oss2>=2.19.1,<3.0.0",
    "cos-python-sdk-v5>=1.9.44,<2.0.0",
    "aioredis>=2.0.1,<3.0.0",
    "prometheus-client>=0.26.0,<1.0.0",
    "setuptools>=83.0.0,<84.0.0",
    "sqlmodel==0.0.39",
    "sqlalchemy==2.0.51",
    "tiktoken>=0.13.0",
    "pytz>=2026.3.post1",
    "jsonschema>=4.26.0,<5.0.0",
    "hvac>=2.4.0",
    "rich>=15.0.0,<16.0.0",
    "fsspec>=2026.7.0,<2027.0.0",
    "s3fs>=2026.7.0,<2027.0.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    # v1.x is maintenance-only but still the stable line; the upper bound keeps
    # v2 (2026-07-28 spec, stateless core, no initialize handshake) out until
    # the adapter is migrated, while still admitting v1 security patches.
    "mcp>=2.0.0,<3",
    "apprise==1.12.0",
    "ag-ui-protocol==0.1.19",
    "litellm==1.95.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=4.1.0",
    "langchain-huggingface>=0.0.6",
    "transformers>=4.52.3",
    "huggingface-hub>=0.32.2",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch==2.6.0",
]
operations = [
    "flower>=2.0.1",
]
knowledge-worker = [
    "docling[rapidocr]==2.113.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.11.13,<0.12.0",
    "import-linter>=2.0,<3.0",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "pip-audit>=2.8.0,<3.0.0",
    "pyright[nodejs]>=1.1.411,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'imghdr' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:apprise\\.utils\\.pgp",
]

[tool.ruff]
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
