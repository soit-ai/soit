[project]
name = "soit"
version = "1.0.0"
description = "A LLM platform with a built-in web application"
readme = "README.md"
authors = [
    { name = "Jude", email = "jude@soit.ai" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.139.2,<1.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>=2.11.7,<3.0.0",
    "emails<1.0,>=0.6",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx>=0.28.1,<1.0.0",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "bcrypt==4.3.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sentry-sdk[fastapi]>=2.20.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.2.1,<6.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pluggy>=1.5.0,<2.0.0",
    "psutil>=7.0.0,<8.0.0",
    "restrictedpython>=8.0,<9.0.0",
    "requests>=2.32.3,<3.0.0",
    "sse-starlette>=2.2.1,<3.0.0",
    "pymilvus==2.6.17",
    "openai==2.53.0",
    "aiofiles>=23.2.1,<24.0.0",
    "python-magic==0.4.27",
    "pandas==2.3.3",
    "openpyxl>=3.1.5,<4.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "PyYAML==6.0.3",
    "google-cloud-storage>=2.14.0,<3.0.0",
    "oss2>=2.18.3,<3.0.0",
    "cos-python-sdk-v5>=1.9.25,<2.0.0",
    "aioredis>=2.0.1,<3.0.0",
    "prometheus-client>=0.21.1,<1.0.0",
    "setuptools>=83.0.0,<84.0.0",
    "sqlmodel==0.0.39",
    "sqlalchemy==2.0.51",
    "tiktoken>=0.9.0",
    "pytz>=2025.2",
    "jsonschema>=4.0.0,<5.0.0",
    "hvac>=2.4.0",
    "rich>=13.9.0,<14.0.0",
    "fsspec>=2025.5.0,<2027.0.0",
    "s3fs>=2025.5.0,<2027.0.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
    "opentelemetry-instrumentation-celery>=0.64b0",
    "opentelemetry-instrumentation-redis>=0.64b0",
    # v1.x is maintenance-only but still the stable line; the upper bound keeps
    # v2 (2026-07-28 spec, stateless core, no initialize handshake) out until
    # the adapter is migrated, while still admitting v1 security patches.
    "mcp>=1.28.1,<2",
    "apprise==1.12.0",
    "ag-ui-protocol==0.1.19",
    "litellm==1.96.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=4.1.0",
    "langchain-huggingface>=0.0.6",
    "transformers>=4.52.3",
    "huggingface-hub>=0.32.2",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "torch==2.6.0",
]
operations = [
    "flower>=2.0.1",
]
knowledge-worker = [
    "docling[rapidocr]==2.113.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.11.13,<0.12.0",
    "import-linter>=2.0,<3.0",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "pip-audit>=2.8.0,<3.0.0",
    "pyright[nodejs]>=1.1.411,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'imghdr' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:apprise\\.utils\\.pgp",
]

[tool.ruff]
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
