[importlinter:contract:application_does_not_import_platform_adapters_or_infra]
name = Application layers use ports instead of platform adapters or infrastructure
type = forbidden
allow_indirect_imports = True
source_modules =
    app.modules.agent.application
    app.modules.evaluation.application
    app.modules.identity.application
    app.modules.knowledge.application
    app.modules.memory.application
    app.modules.modelhub.application
    app.modules.notification.application
    app.modules.observe.application
    app.modules.plugin.application
    app.modules.secrets.application
    app.modules.security.application
    app.modules.workflow.application
forbidden_modules =
    app.adapters
    app.infra

