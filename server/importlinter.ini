[importlinter]
root_package = app

[importlinter:contract:kernel_isolation]
name = Kernel is isolated
type = forbidden
source_modules =
    app.kernel
forbidden_modules =
    app.api
    app.modules
    app.adapters
    app.infra
    app.wiring

[importlinter:contract:kernel_contracts_are_pure]
name = Kernel contracts do not depend on runtime persistence
type = forbidden
allow_indirect_imports = True
source_modules =
    app.kernel.contracts
forbidden_modules =
    app.kernel.runtime
[importlinter:contract:api_does_not_import_domain]
name = API does not import domain directly
type = forbidden
allow_indirect_imports = True
source_modules =
    app.api
forbidden_modules =
    app.modules.agent.domain
    app.modules.knowledge.domain
    app.modules.identity.domain
    app.modules.modelhub.domain
    app.modules.plugin.domain
    app.modules.workflow.domain

[importlinter:contract:agent_application_does_not_import_infra]
name = agent application does not import infra
type = forbidden
allow_indirect_imports = True
source_modules =
    app.modules.agent.application
forbidden_modules =
    app.modules.agent.infra
ignore_imports =
    app.modules.agent.application.application_service -> app.modules.agent.infra.repository
    app.modules.agent.application.versioning_adapter -> app.modules.agent.infra.repository

[importlinter:contract:knowledge_application_does_not_import_infra]
name = knowledge application does not import infra
type = forbidden
allow_indirect_imports = True
source_modules =
