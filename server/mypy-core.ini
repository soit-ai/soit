[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
follow_imports = silent
exclude = (alembic|\.venv)
files =
    app/kernel/contracts,
    app/kernel/ports/http,
    app/kernel/identity/workspace_access.py,
    app/auth/context_resolver.py,
    app/infra/db/transaction.py,
    app/infra/telemetry.py,
    app/adapters/http/governed_fetch.py,
    app/kernel/events/envelope.py,
    app/kernel/events/publisher.py,
    app/kernel/events/dispatcher.py
