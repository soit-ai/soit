[project]
name = "soit-cli"
version = "1.5.0"
description = "Command-line client for SOIT: sign in, run agents, replay regressions, export evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jude", email = "jude@soit.ai" }
]
maintainers = [
    { name = "SOIT maintainers", email = "jude@soit.ai" }
]
requires-python = ">=3.11"
keywords = ["soit", "cli", "agents", "llm", "governance", "evaluation", "evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.urls]
Homepage = "https://soit.ai"
Documentation = "https://docs.soit.ai"
Repository = "https://github.com/soit-ai/soit"
Changelog = "https://github.com/soit-ai/soit/blob/main/CHANGELOG.md"
Issues = "https://github.com/soit-ai/soit/issues"

[project.scripts]
soit = "soit_cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["soit_cli", "tests", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["soit_cli"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001"]
